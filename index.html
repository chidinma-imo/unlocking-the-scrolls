<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Unlocking the Scrolls</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="opening">

        <div class="scroll">

            <div class="scroll-roller left"></div>

            <div class="scroll-paper">

                <p class="eyebrow">SEARCH · CONTEXT · REVELATION</p>

                <h1>
                    Unlocking<br>
                    the Scrolls
                </h1>

                <p class="intro">
                    A place to search the Scriptures,
                    uncover context, and encounter the Word.
                </p>

                <button id="enterButton">
                    Open the Scroll
                </button>

            </div>

            <div class="scroll-roller right"></div>

        </div>

    </main>

    <section id="archive">

        <div class="archive-content">

            <p class="eyebrow">
                THE ARCHIVE
            </p>

            <h2>
                What will you uncover?
            </h2>

            <p>
                Explore Scripture, Bible studies,
                apologetics, questions and writings.
            </p>

        </div>

    </section>

    <script src="script.js"></script>

</body>
</html>
